name: Threads Auto-Post Anti-Ban
on:
  schedule:
    # 09:00 & 20:00 WIB (UTC+7 = UTC 02:00 & 13:00)
    - cron: '0 2,13 * * *'
  workflow_dispatch: # Manual test

jobs:
  post-threads:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install Dependencies
      run: |
        npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth
        
    - name: Auto Post 50 Akun
      env:
        THREADS_ACCOUNTS: ${{ secrets.THREADS_ACCOUNTS }}
      run: node scheduler.js
