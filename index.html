<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threads 50 Akun Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 p-6">
    
    <!-- LOGIN SIMPEL -->
    <div id="loginScreen" class="fixed inset-0 bg-white z-50 flex items-center justify-center hidden">
        <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-sm w-full mx-4">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">🔐 Login</h2>
            <input type="text" id="userInput" placeholder="Username" class="w-full p-4 border rounded-lg mb-4">
            <input type="password" id="passInput" placeholder="Password" class="w-full p-4 border rounded-lg mb-6">
            <button onclick="login()" class="w-full bg-green-500 text-white py-3 rounded-lg font-bold">Masuk</button>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="max-w-4xl mx-auto hidden">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold bg-gradient-to-r from-green-500 to-blue-500 bg-clip-text text-transparent mb-4">
                Threads 50 Akun Auto-Post
            </h1>
            <button onclick="logout()" class="bg-red-500 text-white px-6 py-2 rounded-lg font-bold">Logout</button>
        </div>

        <!-- STATS -->
        <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-8 p-6 bg-white rounded-2xl shadow-xl">
            <div class="text-center"><div id="totalAccounts" class="text-3xl font-bold text-green-600">0</div><div>Akun</div></div>
            <div class="text-center"><div id="totalPosts" class="text-3xl font-bold text-blue-600">0</div><div>Posts</div></div>
            <div class="text-center"><div id="nextPost" class="text-3xl font-bold text-purple-600">20:00</div><div>Selanjutnya</div></div>
            <div class="text-center"><div id="safetyScore" class="text-3xl font-bold text-orange-600">95%</div><div>Safety</div></div>
            <div class="text-center"><div id="statusLog" class="text-xl text-gray-700">Siap</div><div>Status</div></div>
        </div>

        <!-- TAMBAH AKUN -->
        <div class="bg-white p-8 rounded-2xl shadow-2xl mb-8 border-2 border-green-100">
            <h3 class="text-2xl font-bold mb-6">➕ Tambah Akun Threads</h3>
            <form id="accountForm" class="space-y-4">
                <input type="text" id="username" placeholder="akun1_threads" class="w-full p-4 border rounded-lg text-lg" required>
                <input type="text" id="session" placeholder="sessionid=eyJhbGciOiJIUzI1NiIs..." class="w-full p-4 border rounded-lg text-lg" required>
                <button type="submit" class="w-full bg-gradient-to-r from-green-500 to-emerald-600 text-white py-4 px-8 rounded-xl font-bold text-lg shadow-xl hover:shadow-2xl">🚀 Tambah Akun</button>
            </form>
        </div>

        <!-- AKUN LIST -->
        <div class="bg-white rounded-2xl shadow-2xl p-6 border-2 border-blue-100">
            <h3 class="text-xl font-bold mb-4">📋 Daftar Akun (0)</h3>
            <div id="accountsList" class="space-y-3 max-h-96 overflow-y-auto"></div>
        </div>
    </div>

    <script>
        // LOGIN - GANTI SESUKA
        const USERS = { 'admin': 'threads2026', 'threads': '50akun' };
        
        // CHECK LOGIN
        if (!localStorage.getItem('dashboardLoggedIn')) {
            document.getElementById('loginScreen').classList.remove('hidden');
        } else {
            document.getElementById('dashboard').classList.remove('hidden');
            loadAccounts();
        }

        function login() {
            const user = document.getElementById('userInput').value;
            const pass = document.getElementById('passInput').value;
            
            if (USERS[user] && USERS[user] === pass) {
                localStorage.setItem('dashboardLoggedIn', 'true');
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                loadAccounts();
            } else {
                alert('❌ Username/password salah!');
            }
        }

        function logout() {
            localStorage.removeItem('dashboardLoggedIn');
            location.reload();
        }

        // AKUN MANAGEMENT
        let accounts = JSON.parse(localStorage.getItem('threadsAccounts')) || [];
        
        document.getElementById('accountForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const session = document.getElementById('session').value;
            
            accounts.push({ username, session, status: 'active', proxy: 'auto', lastPost: null });
            localStorage.setItem('threadsAccounts', JSON.stringify(accounts));
            
            document.getElementById('username').value = '';
            document.getElementById('session').value = '';
            loadAccounts();
            updateStats();
            
            alert('✅ Akun ' + username + ' ditambahkan!');
        });

        function loadAccounts() {
            const list = document.getElementById('accountsList');
            list.innerHTML = '';
            
            accounts.forEach((account, index) => {
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center p-4 bg-gray-50 rounded-xl border-l-4 border-green-400';
                div.innerHTML = `
                    <div>
                        <div class="font-bold text-lg">${account.username}</div>
                        <div class="text-sm text-gray-600">Status: ${account.status} | Proxy: ${account.proxy}</div>
                    </div>
                    <div class="text-right">
                        <div class="text-sm text-green-600 font-bold">✅ Active</div>
                        <button onclick="deleteAccount(${index})" class="mt-1 bg-red-500 text-white px-4 py-1 rounded text-sm font-bold">Hapus</button>
                    </div>
                `;
                list.appendChild(div);
            });
            
            document.getElementById('totalAccounts').textContent = accounts.length;
        }

        function deleteAccount(index) {
            accounts.splice(index, 1);
            localStorage.setItem('threadsAccounts', JSON.stringify(accounts));
            loadAccounts();
            updateStats();
        }

        function updateStats() {
            document.getElementById('totalAccounts').textContent = accounts.length;
            document.getElementById('totalPosts').textContent = '60+';
            document.getElementById('safetyScore').textContent = '95%';
            document.getElementById('statusLog').textContent = accounts.length ? 'Cron OK' : 'Tambah akun';
        }
    </script>
</body>
</html>
